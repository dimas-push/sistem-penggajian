<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Penggajian RS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container-fluid px-4">
    <span class="navbar-brand d-flex align-items-center gap-2">
      <i class="bi bi-hospital fs-4"></i>
      <span>Sistem Penggajian RS</span>
    </span>
    <span class="text-white-50 small d-none d-md-inline">RS. Delima Asih Sisma Medika</span>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small py-3 border-top mt-auto">
  &copy; 2026 RS. Delima Asih Sisma Medika &mdash; Sistem Penggajian Otomatis
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
